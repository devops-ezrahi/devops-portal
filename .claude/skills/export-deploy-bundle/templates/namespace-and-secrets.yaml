# The devops-portal chart deliberately excludes the Namespace object (relies
# on `helm install --create-namespace` / ArgoCD's CreateNamespace=true) and
# Secrets with real values (managed out-of-band by sync-env-to-k3s.sh) — see
# devops-portal/CLAUDE.md. This bundle has neither helm nor ArgoCD on the
# target machine, so this file supplies both as empty placeholders, applied
# before the rendered chart manifest.
apiVersion: v1
kind: Namespace
metadata:
  name: devops-portal
---
apiVersion: v1
kind: Secret
metadata:
  name: devops-portal-secrets
  namespace: devops-portal
type: Opaque
stringData:
  JIRA_URL: ""
  JIRA_TOKEN: ""
  JIRA_PROJECT_KEY: ""
  ARTIFACTORY_URL: ""
  ARTIFACTORY_REPO: ""
  ARTIFACTORY_TOKEN: ""
  CHAT_API_URL: ""
  CHAT_API_KEY: ""
  CHAT_MODEL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-secrets
  namespace: devops-portal
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_SECRET: ""   # set to the Keycloak client secret
  OAUTH2_PROXY_COOKIE_SECRET: ""   # 16/24/32 random bytes, base64-encoded
