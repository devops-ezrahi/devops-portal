# image.tag is bumped by .gitea/workflows/deploy.yaml on every push to main —
# do not hand-edit it as part of an unrelated change, and never set an inline
# `helm.values` override on the ArgoCD Application for this chart, or it will
# permanently pin this value and silently swallow every CI deploy.
#
# repository points at the in-cluster registry (../homelab/manifests/registry.yaml)
# at registry.homelab.local — CI (.gitea/workflows/deploy.yaml) runs in a
# Docker-in-Docker sidecar isolated from the k3d node's containerd, so unlike
# the homelab repo's mock services (side-loaded directly, see
# ../homelab/scripts/01-build-mocks.sh) it has to push through a registry.
# The node's containerd needs to trust this registry too — see
# ../homelab/registries.yaml.
#
# scripts/deploy-k3s.sh (the local fast-path deploy) runs with full host
# Docker access, so it overrides this back to a bare `devops-portal` image
# name via `--set image.repository=devops-portal` and side-loads directly —
# no registry round-trip needed for local iteration.
image:
  repository: registry.homelab.local/devops-portal
  tag: "28758f9"
  pullPolicy: IfNotPresent

# Public URL the browser uses to reach the portal (Traefik Ingress hostname,
# see templates/ingress.yaml — needs a homelab hosts-file entry, same as
# every other *.homelab.local service; see ../homelab/CLAUDE.md).
# This is the single source for both the client-side SSO redirect
# (config.SSO_URL, derived in templates/configmap.yaml) and oauth2-proxy's
# --redirect-url (templates/deployment.yaml) — change only this value when
# moving to a different network instead of editing both places.
externalUrl: "http://devops-portal.homelab.local"

oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
  # Keycloak realm issuer this cluster's oauth2-proxy authenticates against.
  oidcIssuerUrl: "http://keycloak.homelab.local/realms/devops"
  clientId: "devops-portal"
  cookieSecure: "false"

config:
  ADMIN_GROUP: "devops-admins"
  ALLOWED_GROUPS: "devops-admins|devops-platform"
  SSO_REQUIRED: "true"
