# Secrets (devops-portal-secrets, oauth2-proxy-secrets) are deliberately NOT
# defined in this chart — they're managed out-of-band by
# scripts/sync-env-to-k3s.sh so ArgoCD's selfHeal never reverts real values
# back to a placeholder checked into Git. This Deployment references them by
# name; they must exist in-cluster before the first rollout (run
# sync-env-to-k3s.sh once as part of initial bootstrap).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portal
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-portal
  template:
    metadata:
      labels:
        app: devops-portal
    spec:
      containers:
        # Sidecar: authenticates the browser against Keycloak and forwards
        # x-forwarded-* identity headers to the app over localhost. The
        # devops-portal container is never reachable directly (no Service
        # exposes port 8080) so this is the only way in.
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          args:
            - --provider=keycloak-oidc
            - --oidc-issuer-url=http://10.42.0.1:30084/realms/devops
            - --client-id=devops-portal
            - --upstream=http://localhost:8080
            - --http-address=0.0.0.0:4180
            - --redirect-url=http://localhost:4180/oauth2/callback
            - --email-domain=*
            - --cookie-secure=false
            - --pass-user-headers=true
            - --oidc-groups-claim=groups
            - --scope=openid profile email groups
            - --skip-provider-button=true
            - --custom-templates-dir=/templates
          envFrom:
            - secretRef:
                name: oauth2-proxy-secrets
          volumeMounts:
            - name: oauth2-proxy-templates
              mountPath: /templates
          ports:
            - containerPort: 4180
        - name: devops-portal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: devops-portal-config
            - secretRef:
                name: devops-portal-secrets
      volumes:
        - name: oauth2-proxy-templates
          configMap:
            name: oauth2-proxy-templates
