name: CI

on:
  # Not an unfiltered `on: push` — the Stop hook auto-pushes a checkpoint
  # commit to origin every turn, which would fire this on every branch.
  # main = stable channel, dev = prerelease channel (see .releaserc.json).
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  # .npmrc is tracked and sets script-shell to a Windows Git-bash path;
  # this overrides it so lifecycle scripts work on a Linux runner.
  npm_config_script_shell: /bin/bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfile
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit && vite build

  # Release + whitening pack on push to main (stable) or dev (prerelease).
  # Gated on `test` so a broken commit never gets released or handed off.
  pack:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and the v*/pack/* tags
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # ...and on released PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pack/* tags are the delta baseline

      - uses: actions/checkout@v4
        with:
          repository: shugi12345/whitening-packer
          path: .packer
          # token: ${{ secrets.PACKER_TOKEN }}   # only if that repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Derives the version from the Conventional Commits since the last v* tag,
      # writes it into package.json/package-lock.json, commits that back with
      # [skip ci], tags v<version> (X.Y.Z-dev.N on dev) and cuts the GitHub
      # release. Must run before the pack step and in this same workspace:
      # pack.py reads package.json off disk to name the tgz and the pack/* tag.
      # No releasable commits -> exits 0, version untouched, pack still runs.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # python3, not python — the runner image doesn't guarantee the alias.
      # Running the script by path puts .packer on sys.path so its sibling
      # imports resolve. This job is where department/team/repository come
      # from — the packer writes them into the pack's repository/config.json.
      # "images": false (skip the docker-save tars, ~127 MB -> ~1 MB) stays in
      # whitening.json. pack.py prints only the .tgz path on stdout; git
      # describe then picks up the pack/* tag it just created on HEAD.
      - id: pack
        env:
          WHITENING_DEPARTMENT: ultra
          WHITENING_TEAM: dem
          WHITENING_REPOSITORY: devops-portal
        run: |
          echo "pack=$(python3 .packer/pack.py .)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 --match 'pack/*')" >> "$GITHUB_OUTPUT"

      - run: git push origin --tags

      # Release asset, not an artifact: downloads as the file itself
      # (dem-devops-portal-<version>.tgz), no wrapper zip, permanent URL. The
      # portal's whitening module reads repository/config.json, not this name.
      # gh is preinstalled.
      # Runs after the tag push so the release has a tag on the remote.
      - run: gh release create "$TAG" "$PACK" --title "$TAG" --notes "Whitening pack for ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          PACK: ${{ steps.pack.outputs.pack }}
