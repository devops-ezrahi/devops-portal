name: CI

on:
  # Not an unfiltered `on: push` — the Stop hook auto-pushes a checkpoint
  # commit to origin every turn, which would fire this on every branch.
  # main = stable channel, dev = prerelease channel (see .releaserc.json).
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  # .npmrc is tracked and sets script-shell to a Windows Git-bash path;
  # this overrides it so lifecycle scripts work on a Linux runner.
  npm_config_script_shell: /bin/bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfile
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit && vite build

  # Release + image + whitening pack on push to main (stable) or dev
  # (prerelease). Gated on `test` so a broken commit never gets released,
  # published or handed off.
  pack:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and the v*/pack/* tags
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # ...and on released PRs
      packages: write # push the image to ghcr.io/<owner>/<repo>
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pack/* tags are the delta baseline

      - uses: actions/checkout@v4
        with:
          repository: shugi12345/whitening-packer
          path: .packer
          # token: ${{ secrets.PACKER_TOKEN }}   # only if that repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Derives the version from the Conventional Commits since the last v* tag,
      # writes it into package.json/package-lock.json, commits that back with
      # [skip ci], tags v<version> (X.Y.Z-dev.N on dev) and cuts the GitHub
      # release. Must run before the pack step and in this same workspace:
      # pack.py reads package.json off disk to name the tgz, and the tag it just
      # created is where the pack gets uploaded.
      #
      # .releaserc.json floors every commit at patch, so a push always releases.
      # The before/after version diff is the guard for the case it doesn't
      # (nothing but the [skip ci] release commit, say): packing then would
      # rebuild a version that's already published, so skip it instead.
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          before=$(node -p "require('./package.json').version")
          npx semantic-release
          after=$(node -p "require('./package.json').version")
          echo "version=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "no new version — skipping pack"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # The image. Built here rather than in its own job because semantic-release
      # has just written the new version into this workspace's package.json, so
      # the build context is already correct and needs no second checkout.
      # The Dockerfile is self-building from source (.dockerignore drops dist/),
      # so nothing has to be handed over from the `test` job either.
      #
      # github.token authenticates to GHCR on the strength of `packages: write`
      # above — no secret to rotate. github.repository is already lowercase,
      # which GHCR requires.
      - if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
          # Two `npm ci` runs per build; without a cache this is ~4 min of the job.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # python3, not python — the runner image doesn't guarantee the alias.
      # Running the script by path puts .packer on sys.path so its sibling
      # imports resolve. This job is where department/team/repository come
      # from — the packer writes them into the pack's repository/config.json.
      # "images": false (skip the docker-save tars, ~127 MB -> ~1 MB) stays in
      # whitening.json. pack.py prints only the .tgz path on stdout and creates
      # no tags of its own — it deltas against the release tag before this one.
      - id: pack
        if: steps.release.outputs.released == 'true'
        env:
          WHITENING_DEPARTMENT: ultra
          WHITENING_TEAM: dem
          WHITENING_REPOSITORY: devops-portal
        run: echo "pack=$(python3 .packer/pack.py .)" >> "$GITHUB_OUTPUT"

      # Onto the release semantic-release just cut, so a version is one tag and
      # one release. Release asset, not an artifact: downloads as the file
      # itself (dem-devops-portal-<version>.tgz), no wrapper zip, permanent URL.
      # The portal's whitening module reads repository/config.json, not this
      # name. gh is preinstalled.
      - if: steps.release.outputs.released == 'true'
        run: gh release upload "v$VERSION" "$PACK"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PACK: ${{ steps.pack.outputs.pack }}

      # This is the deploy. ArgoCD watches homelab's main branch (Application
      # `devops-portal`, path devops-portal/chart, automated + selfHeal), so
      # writing the tag there is what makes the cluster pick the image up —
      # within one reconcile (~3 min), with nothing to run by hand.
      #
      # Last step in the job on purpose: by the time it runs the image is
      # already in GHCR and the pack is already on the release, so a homelab
      # push failure costs only the rollout, not the release.
      #
      # github.token is scoped to this repo and cannot push to homelab, hence
      # the separate PAT.
      - if: steps.release.outputs.released == 'true'
        name: Point the homelab chart at the new image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TOKEN: ${{ secrets.HOMELAB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/devops-ezrahi/homelab.git" "$RUNNER_TEMP/homelab"
          cd "$RUNNER_TEMP/homelab"
          # Range-anchored to the image: block, so an unrelated "  tag:" key
          # elsewhere in the file is never touched.
          sed -i "/^image:/,/^[^ ]/ s|^  tag: .*|  tag: \"${VERSION}\"|" \
            devops-portal/chart/values.yaml
          if git diff --quiet; then
            echo "chart already pinned to ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: portal image ${VERSION}"
          # main and dev can finish close enough together to race for the push.
          git push || { git pull --rebase && git push; }
