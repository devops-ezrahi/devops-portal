name: CI

on:
  # Not an unfiltered `on: push` — the Stop hook auto-pushes a checkpoint
  # commit to origin every turn, which would fire this on every branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # .npmrc is tracked and sets script-shell to a Windows Git-bash path;
  # this overrides it so lifecycle scripts work on a Linux runner.
  npm_config_script_shell: /bin/bash

  # Not consumed by any step — the whitening packer greps this file for TEAM
  # (pack.py detect_team), so CI and local packs name the zip identically.
  # Don't delete it as unused config.
  TEAM: dvps

  # "true" skips the images/ folder (the docker save tars of every FROM base
  # image) — takes the pack from ~127 MB to ~1 MB, but the result can't be
  # built on an air-gapped machine that doesn't already have those images.
  # A repo variable of the same name overrides this without editing the file.
  PACK_NO_IMAGES: ${{ vars.PACK_NO_IMAGES || 'false' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfile
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit && vite build

  # Whitening pack on merge to main. Gated on `test` so a broken commit
  # never gets packed and handed off.
  pack:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the pack/* tag back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pack/* tags are the delta baseline

      - uses: actions/checkout@v4
        with:
          repository: shugi12345/whitening-packer
          path: .packer
          # token: ${{ secrets.PACKER_TOKEN }}   # only if that repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # python3, not python — the runner image doesn't guarantee the alias.
      # Running the script by path puts .packer on sys.path so its sibling
      # imports resolve. Docker is preinstalled, so images/ gets populated.
      # No --team: the packer reads TEAM out of this file.
      # pack.py prints only the zip path on stdout; git describe then picks up
      # the pack/* tag it just created on HEAD.
      - id: pack
        run: |
          # if, not `[ … ] && flags=…` — a false test is a non-zero status and
          # GitHub runs these steps with `bash -e`.
          flags=""
          if [ "$PACK_NO_IMAGES" = "true" ]; then flags="--no-images"; fi
          echo "zip=$(python3 .packer/pack.py . $flags)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git describe --tags --abbrev=0 --match 'pack/*')" >> "$GITHUB_OUTPUT"

      - run: git push origin --tags

      # Release asset, not an artifact: downloads as the file itself
      # (dvps-devops-portal-<version>.zip — the name the portal's whitening
      # module parses), no wrapper zip, permanent URL. gh is preinstalled.
      # Runs after the tag push so the release has a tag on the remote.
      - run: gh release create "$TAG" "$ZIP" --title "$TAG" --notes "Whitening pack for ${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          ZIP: ${{ steps.pack.outputs.zip }}
