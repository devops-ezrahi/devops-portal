name: CI

on:
  # Not an unfiltered `on: push` — the Stop hook auto-pushes a checkpoint
  # commit to origin every turn, which would fire this on every branch.
  # main = stable channel, dev = prerelease channel (see .releaserc.json).
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  # .npmrc is tracked and sets script-shell to a Windows Git-bash path;
  # this overrides it so lifecycle scripts work on a Linux runner.
  npm_config_script_shell: /bin/bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfile
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit && vite build

  # Release + whitening pack on push to main (stable) or dev (prerelease).
  # Gated on `test` so a broken commit never gets released or handed off.
  pack:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit and the v*/pack/* tags
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # ...and on released PRs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pack/* tags are the delta baseline

      - uses: actions/checkout@v4
        with:
          repository: shugi12345/whitening-packer
          path: .packer
          # token: ${{ secrets.PACKER_TOKEN }}   # only if that repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Derives the version from the Conventional Commits since the last v* tag,
      # writes it into package.json/package-lock.json, commits that back with
      # [skip ci], tags v<version> (X.Y.Z-dev.N on dev) and cuts the GitHub
      # release. Must run before the pack step and in this same workspace:
      # pack.py reads package.json off disk to name the tgz, and the tag it just
      # created is where the pack gets uploaded.
      #
      # .releaserc.json floors every commit at patch, so a push always releases.
      # The before/after version diff is the guard for the case it doesn't
      # (nothing but the [skip ci] release commit, say): packing then would
      # rebuild a version that's already published, so skip it instead.
      - id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          before=$(node -p "require('./package.json').version")
          npx semantic-release
          after=$(node -p "require('./package.json').version")
          echo "version=$after" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "no new version — skipping pack"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      # python3, not python — the runner image doesn't guarantee the alias.
      # Running the script by path puts .packer on sys.path so its sibling
      # imports resolve. This job is where department/team/repository come
      # from — the packer writes them into the pack's repository/config.json.
      # "images": false (skip the docker-save tars, ~127 MB -> ~1 MB) stays in
      # whitening.json. pack.py prints only the .tgz path on stdout and creates
      # no tags of its own — it deltas against the release tag before this one.
      - id: pack
        if: steps.release.outputs.released == 'true'
        env:
          WHITENING_DEPARTMENT: ultra
          WHITENING_TEAM: dem
          WHITENING_REPOSITORY: devops-portal
        run: echo "pack=$(python3 .packer/pack.py .)" >> "$GITHUB_OUTPUT"

      # Onto the release semantic-release just cut, so a version is one tag and
      # one release. Release asset, not an artifact: downloads as the file
      # itself (dem-devops-portal-<version>.tgz), no wrapper zip, permanent URL.
      # The portal's whitening module reads repository/config.json, not this
      # name. gh is preinstalled.
      - if: steps.release.outputs.released == 'true'
        run: gh release upload "v$VERSION" "$PACK"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          PACK: ${{ steps.pack.outputs.pack }}
