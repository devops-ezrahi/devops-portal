name: CI

on:
  # Not an unfiltered `on: push` — the Stop hook auto-pushes a checkpoint
  # commit to origin every turn, which would fire this on every branch.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # .npmrc is tracked and sets script-shell to a Windows Git-bash path;
  # this overrides it so lifecycle scripts work on a Linux runner.
  npm_config_script_shell: /bin/bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the Dockerfile
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # tsc --noEmit && vite build

  # Whitening pack on merge to main. Gated on `test` so a broken commit
  # never gets packed and handed off.
  pack:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the pack/* tag back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # pack/* tags are the delta baseline

      - uses: actions/checkout@v4
        with:
          repository: shugi12345/whitening-packer
          path: .packer
          # token: ${{ secrets.PACKER_TOKEN }}   # only if that repo is private

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # python3, not python — the runner image doesn't guarantee the alias.
      # Running the script by path puts .packer on sys.path so its sibling
      # imports resolve. Docker is preinstalled, so images/ gets populated.
      - run: python3 .packer/pack.py . --team dvps

      - run: git push origin --tags

      - uses: actions/upload-artifact@v4
        with:
          name: whitening-pack
          # Name is the packer's convention and the portal's whitening module
          # parses it (parseZipName) — don't add run numbers or SHAs.
          path: dvps-devops-portal-*.zip
